<div class="brief-ai-toolbar" data-brief-suggest data-suggest-url="{% url 'orders:suggest-clipping-brief' %}">
  <div>
    <strong>Want a quick start?</strong>
    <span>AI can draft from YouTube video details or a topic you provide. For Drive and Dropbox links, add a short topic; the recording is analyzed after you start.</span>
  </div>
  <button class="brief-ai-button" type="button" data-brief-suggest-button>
    <span aria-hidden="true">✦</span> Suggest with AI
  </button>
  <label class="brief-ai-replace"><input type="checkbox" data-brief-replace> Replace text already entered</label>
  <p class="brief-ai-status" data-brief-suggest-status role="status" aria-live="polite"></p>
</div>
